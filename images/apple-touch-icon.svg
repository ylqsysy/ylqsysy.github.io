<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#234e78"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8d5a3"/>
      <stop offset="50%" stop-color="#f0e2b6"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="180" height="180" rx="36" fill="url(#bg)"/>
  <rect width="180" height="180" rx="36" fill="url(#shine)"/>

  <!-- Inner border -->
  <rect x="11" y="11" width="158" height="158" rx="25" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>

  <!-- Top decorative line -->
  <line x1="50" y1="45" x2="130" y2="45" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <polygon points="42,45 46.5,41.5 50,45 46.5,48.5" fill="url(#gold)" opacity="0.6"/>
  <polygon points="130,45 133.5,41.5 137,45 133.5,48.5" fill="url(#gold)" opacity="0.6"/>

  <!-- Monogram -->
  <text x="63" y="121" font-family="'Georgia','Times New Roman',serif" font-size="73" font-weight="700" fill="url(#gold)" filter="url(#shadow)" text-anchor="middle" letter-spacing="-2">Y</text>
  <circle cx="90" cy="104" r="2.8" fill="url(#gold)" opacity="0.6"/>
  <text x="118" y="121" font-family="'Georgia','Times New Roman',serif" font-size="73" font-weight="700" fill="url(#gold)" filter="url(#shadow)" text-anchor="middle" letter-spacing="-2">Z</text>

  <!-- Bottom decorative line -->
  <line x1="50" y1="138" x2="130" y2="138" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <polygon points="42,138 46.5,134.5 50,138 46.5,141.5" fill="url(#gold)" opacity="0.6"/>
  <polygon points="130,138 133.5,134.5 137,138 133.5,141.5" fill="url(#gold)" opacity="0.6"/>
</svg>
